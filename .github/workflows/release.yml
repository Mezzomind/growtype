name: Release

# semantic-release reads conventional commits on main and writes the next version into both
# packages. It stages them on npm with trusted publishing (OIDC, no npm token), then commits
# the version bump and tags it. A maintainer approves each staged version with 2FA
# (`npm stage approve` or npmjs.com). Run the workflow again to retry; a failed stage
# happens before the tag, so the same commits are released on the next run.
#
# One-time setup per package on npmjs.com (Package → Settings → Trusted publishing):
# GitHub Actions, organization "Mezzomind", repository "growtype", workflow "release.yml",
# and allow "npm stage publish" (not direct publish). Trusted publishing can only be set up
# on a package that already exists, so the very first version is published by hand
# (see README → Release).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # version commit, git tag, and GitHub release
  issues: write # comment on issues mentioned in the release
  pull-requests: write # comment on pull requests mentioned in the release
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: true

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          # packageManager in package.json selects pnpm; frozen install via require-lockfile
          require-lockfile: true

      # Staged publishing needs npm CLI >= 11.15.0. semantic-release also uses npm to
      # write the version into package.json.
      - run: npm install -g npm@^11.15.0

      - run: pnpm run ready
      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
